# Font
font_family FiraCode Nerd Font Mono Med
bold_font FiraCode Nerd Font Mono
italic_font JetBrainsMono NFM Italic
bold_italic_font JetBrainsMono NFM Bold Italic
font_size 12
disable_ligatures never

# Cursour
cursor_shape block
shell_integration no-cursor no-cwd
cursor_blink_interval 0
cursor_trail 1

# Window settings
background_opacity 0.8
remember_window_size no
initial_window_width 1128
initial_window_height 582
confirm_os_window_close 0
window_padding_width 0 1

# Key mappings
map ctrl+c copy_and_clear_or_interrupt
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \x1bd
map ctrl+f5 load_config_file
mouse_map ctrl+left release ungrabbed mouse_handle_click link

### Tab management
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+shift+f2 set_tab_title
map ctrl+shift+d new_tab_with_cwd

### Scrolling
map ctrl+u scroll_page_up
map ctrl+d scroll_page_down

#### Scroll half a page
map page_up remote_control scroll-window 0.5p-
map page_down remote_control scroll-window 0.5p+

### Unbind
map ctrl+shift+s no_op
# map ctrl+d no_op
mouse_map left click ungrabbed no_op

enabled_layouts splits:split_axis=horizontal
map f4 launch --location=split

# Misc
# enable_audio_bell no
# window_alert_on_bell no
# command_on_bell none
# startup_session none
# update_check_interval 0

# Remote control
allow_remote_control yes
listen_on unix:/tmp/kitty

# BEGIN_KITTY_THEME
# One Dark Pro
include current-theme.conf
# END_KITTY_THEME
